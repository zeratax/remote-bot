[package]
name = "remote-bot-discord"
version = "0.1.0"
edition = "2024"

[dependencies]
remote-bot-shared = { path = "../shared" }
chrono = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
config = { workspace = true }

serenity = { version = "0.12.2", default-features = false, features = ["client", "collector", "gateway", "model", "rustls_backend", "unstable_discord_api"] }
colored = "3.0.0"
lettre = { version = "0.11.8" }
url = "2.5.4"
reqwest = "0.12.15"
uuid = { version = "1.16.0", features = ["v7"] }
