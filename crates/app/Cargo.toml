[package]
name = "remote-bot-app"
version = "0.1.0"
edition = "2024"

[dependencies]
remote-bot-shared = { path = "../shared", optional = true }
chrono = { workspace = true, optional = true }
codee = "0.3.0"
leptos = { workspace = true, features = [] }
leptos-use = { version = "0.15.7", default-features = false, optional = true }
leptos_meta.workspace = true
leptos_router.workspace = true
reactive_graph = "0.1.8"
serde = { workspace = true }
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Notification"] }

gloo-timers = { version = "0.3.0", optional = true }
serde_json = "1.0.140"
send_wrapper = "0.6.0"

[features]
default = ["hydrate"]

hydrate = [
    "leptos-use",
    "leptos-use/storage",
    "leptos-use/use_cookie",
    "leptos-use/use_preferred_dark",
    "leptos-use/use_intersection_observer",
    "leptos-use/use_document",
    "leptos/hydrate",
    "leptos/nightly",
    "wasm-bindgen",
    "js-sys",
    "web-sys",
    "gloo-timers",
]

ssr = [
    "chrono",
    "leptos-use",
    "leptos-use/actix",
    "leptos-use/ssr",
    "leptos-use/storage",
    "leptos-use/use_cookie",
    "leptos-use/use_preferred_dark",
    "leptos-use/use_intersection_observer",
    "leptos/ssr",
    "leptos/nightly",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "leptos_router/nightly",
    "remote-bot-shared",
    "sqlx",
    "tokio",
]

[dev-dependencies]
