[package]
name = "remote-bot-server"
version = "0.1.0"
edition = "2024"

[dependencies]
remote-bot-app = { path = "../app", default-features = false, features = ["ssr"] }
remote-bot-discord = { path = "../bot" }
remote-bot-shared = { path = "../shared" }
leptos = { workspace = true, features = ["ssr", "nightly"] }
leptos_meta = { workspace = true, features = ["ssr"] }
leptos_router = { workspace = true, features = ["ssr", "nightly"] }
leptos_actix.workspace = true
sqlx = { workspace = true }
tokio = { workspace = true }
config = { workspace = true }
actix-files = "0.6"
actix-web = "4"
dotenvy = "0.15"
futures = "0.3"
reqwest = "0.12"
actix = "0.13"
actix-web-actors = "4.2"
serde = { workspace = true }
serde_json = "1.0"
uuid = { version = "1.3", features = ["v4", "serde"] }
